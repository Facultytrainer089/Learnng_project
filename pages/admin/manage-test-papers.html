<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Test Papers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Test Papers</h2>
        <a href="add-test-paper.html" class="btn btn-primary">+ Add Test Paper</a>
    </div>

    <div class="table-responsive">
        <table class="table table-bordered table-striped">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Paper Name</th>
                    <th>Category</th>
                    <th>Difficulty</th>
                    <th>Questions</th>
                    <th>Duration</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Python Fundamentals</td>
                    <td>Programming</td>
                    <td>Beginner</td>
                    <td>20</td>
                    <td>30 min</td>
                    <td>
                        <button class="btn btn-sm btn-warning">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deletePaper()">Delete</button>
                    </td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>JavaScript Essentials</td>
                    <td>Programming</td>
                    <td>Intermediate</td>
                    <td>25</td>
                    <td>40 min</td>
                    <td>
                        <button class="btn btn-sm btn-warning">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deletePaper()">Delete</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function deletePaper() {
    if (confirm('Are you sure you want to delete this test paper?')) {
        alert('Test paper deleted successfully.');
    }
}
</script>
</body>
</html>
