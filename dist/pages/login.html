<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Atlas Learning</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef4ff, #f8f9fa); }
        .auth-card { max-width: 480px; margin: 80px auto; border: none; border-radius: 16px; box-shadow: 0 12px 35px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card">
            <div class="card-body p-5">
                <h2 class="text-center fw-bold mb-4">Login</h2>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <p class="text-center mt-3 mb-0">
                    Don’t have an account?
                    <a href="register.html">Register here</a>
                </p>
                <div class="text-center mt-3">
                    <a href="../index.html" class="text-decoration-none">← Back to home</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
